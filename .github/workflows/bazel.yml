name: Bazel AMD64 source

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bazel-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Explicitly test the PR head, including forks; never base-only.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.3'
      - name: Install the JUnit report parser
        run: python3 -m pip install --require-hashes -r tools/bazel/requirements-ci.txt
      - name: Install verified project-local Bazel
        run: bash tools/bazel/install-ci-bazel.sh
      - name: Build and execute declared source gates
        env:
          BAZEL: ${{ runner.temp }}/relay-tools/bazel
          CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_STATE: ${{ runner.temp }}/relay-bazel
          CI_EVIDENCE: ${{ github.workspace }}/ci-evidence
        run: bash tools/bazel/ci.sh
      - name: Preserve receipts even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: relay-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          # Explicit outputs only; raw BEPs/action graphs stay in CI_STATE.
          path: |
            ci-evidence/provenance.txt
            ci-evidence/exit-code.txt
            ci-evidence/SHA256SUMS
            ci-evidence/driver.log
            ci-evidence/ci.bazelrc
            ci-evidence/module-graph.txt
            ci-evidence/configured-files.txt
            ci-evidence/action-audit.json
            ci-evidence/test-audit.json
            ci-evidence/MODULE.bazel.lock
            ci-evidence/artifacts/__dhcp4relay_runtime/runtime_rttar.tar
            ci-evidence/artifacts/__dhcp4relay_runtime.debug_symbols/runtime.debug_symbols.tar
            ci-evidence/artifacts/___dhcp4_metadata/dhcp4_metadata.json
            ci-evidence/artifacts/__dhcp6relay_runtime/runtime_rttar.tar
            ci-evidence/artifacts/__dhcp6relay_runtime.debug_symbols/runtime.debug_symbols.tar
            ci-evidence/artifacts/___dhcp6_metadata/dhcp6_metadata.json
            ci-evidence/artifacts/*/outputs.txt
            ci-evidence/bazel-testlogs/tests/runtime/*/test.xml
            ci-evidence/bazel-testlogs/tests/runtime/*/test.log
          if-no-files-found: error
          retention-days: 14
