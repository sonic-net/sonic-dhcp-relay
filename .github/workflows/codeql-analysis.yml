# For more information, please visit: https://github.com/github/codeql-action
name: "CodeQL"

on:
  push:
    branches:
      - 'master'
      - '202[0-9][0-9][0-9]'
  pull_request:
    branches:
      - 'master'
      - '202[0-9][0-9][0-9]'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ 'cpp' ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install verified project-local Bazel
        run: bash tools/bazel/install-ci-bazel.sh

      # These external targets contain no relay sources. Preparing them before
      # tracing keeps their private loaders and generated tools out of CodeQL.
      - name: Build external dependencies
        run: |
          bazel --batch --output_base="$RUNNER_TEMP/relay-codeql" build --config=codeql \
            @sonic_swss_common//:libswsscommon_shared @com_google_googletest//:gtest_main

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2.1.29
        with:
          config-file: ./.github/codeql/codeql-config.yml
          languages: ${{ matrix.language }}

      - name: Trace the DHCPv6 daemon and C++ test builds
        run: |
          bazel --batch --output_base="$RUNNER_TEMP/relay-codeql" build --config=codeql \
            //dhcp6relay:dhcp6relay //dhcp6relay:relay_test //dhcp6relay:sender_test

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2.1.29
        with:
          category: "/language:${{matrix.language}}"
